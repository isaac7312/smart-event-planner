<div class="add-event-wrapper">
  <h2>Add New Event</h2>
  <p class="subtitle">Create your event</p>

  <form class="add-event-form" (ngSubmit)="createEvent()" #eventForm="ngForm">

    <div class="form-row">
      <div class="form-group">
        <label>Event Name</label>
        <input type="text" name="name" [(ngModel)]="event.name" required />
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" [(ngModel)]="event.category" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Venue</label>
        <input type="text" name="venue" [(ngModel)]="event.venue" required />
      </div>

      <div class="form-group">
        <label>Date & Time</label>
        <input type="datetime-local" name="date_time" [(ngModel)]="event.date_time" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Capacity</label>
        <input type="number" name="capacity" [(ngModel)]="event.capacity" />
      </div>

      <div class="form-group">
        <label>Price (₹)</label>
        <input type="number" name="price" [(ngModel)]="event.price" />
      </div>
    </div>

    <div class="form-group full">
      <label>Description</label>
      <textarea name="description" [(ngModel)]="event.description"></textarea>
    </div>

    <button type="submit" class="create-btn">
      Create Event
    </button>

  </form>
</div>
