<div class="edit-event-wrapper">
  <div class="edit-card">

    <h2>Edit Event</h2>
    <p class="subtitle">Update your event details</p>

    <form (ngSubmit)="updateEvent()">

      <div class="form-grid">
        <div>
          <label>Event Name</label>
          <input type="text" [(ngModel)]="event.name" name="name" required />
        </div>

        <div>
          <label>Category</label>
          <input type="text" [(ngModel)]="event.category" name="category" required />
        </div>

        <div>
          <label>Venue</label>
          <input type="text" [(ngModel)]="event.venue" name="venue" required />
        </div>

        <div>
          <label>Date</label>
          <input type="date" [(ngModel)]="event.date_time" name="date_time" required />
        </div>

        <div>
          <label>Capacity</label>
          <input type="number" min="1" [(ngModel)]="event.capacity" name="capacity" />
        </div>

        <div>
          <label>Price (₹)</label>
          <input type="number" min="0" [(ngModel)]="event.price" name="price" />
        </div>
      </div>

      <div class="full-width">
        <label>Description</label>
        <textarea rows="4" [(ngModel)]="event.description" name="description"></textarea>
      </div>

      <button class="update-btn" type="submit">
        Update Event
      </button>

    </form>
  </div>
</div>
